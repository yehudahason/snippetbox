services:
  mysql:
    image: mysql:8.4
    container_name: snippetbox-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: snippetbox
      MYSQL_USER: web
      MYSQL_PASSWORD: pass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uweb", "-ppass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
