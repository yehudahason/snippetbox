services:
  mysql:
    image: mysql:8.4
    container_name: snippetbox-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpass

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql_data:
